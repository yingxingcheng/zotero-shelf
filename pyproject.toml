[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zotero-shelf"
version = "0.1.1"
description = "Your Zotero library and WebDAV PDFs, in the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Yingxing Cheng"}]
keywords = ["zotero", "webdav", "research", "bibliography", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = ["pyzotero>=1.16,<2", "httpx2>=2.13,<3", "rich>=13.9,<15", "bibtexparser>=1.4.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "twine>=6,<7", "coverage>=7.6,<8"]

[project.scripts]
zshelf = "zotero_shelf.cli:main"
zotero-shelf = "zotero_shelf.cli:main"

[project.urls]
Homepage = "https://github.com/yingxingcheng/zotero-shelf"
Issues = "https://github.com/yingxingcheng/zotero-shelf/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_shelf"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md", "/CONTRIBUTING.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
